<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Project Contacts · H2SEP</title>
  <meta name="description" content="Project contact list — Home2 Suites Eagle Pass (Triun Construction & Engineering)">
  <meta name="theme-color" content="#0B0D10">
  <link rel="icon" href="./icons/favicon-48.png">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/contacts-page.css">
  <script>/* apply saved theme before first paint (default light) */
    try { document.documentElement.setAttribute('data-theme',
      localStorage.getItem('h2sep-theme') === 'dark' ? 'dark' : 'light'); } catch (e) {}
  </script>
</head>
<body>
  <header class="appbar">
    <a class="ab-btn" href="./index.html" aria-label="Back">‹</a>
    <h1 class="ab-title">Project Contacts</h1>
    <div class="ab-right"><span class="ct-count" id="count"></span></div>
  </header>
  <div class="ct-searchbar">
    <input type="search" id="q" class="ct-search" placeholder="Search name, company, trade, phone…"
           autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search contacts">
  </div>
  <main class="content" id="body">
    <div class="empty">Loading contacts…</div>
  </main>
  <noscript><div class="empty">This page needs JavaScript enabled.</div></noscript>
  <script type="module" src="./js/contacts-page.js"></script>
</body>
</html>
